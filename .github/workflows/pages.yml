name: Deploy Flexy Mini to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: DEVELOPMENT-GUARD-001 — test both allowed and rejected architecture fixtures
        run: node --test tests/development-guard.test.mjs
      - name: DEVELOPMENT-GUARD-001 — block unapproved standalone UI and frameworks
        run: node scripts/development-guard.mjs
      - run: npm install --no-audit --no-fund
      - name: Capture build timestamp
        run: echo "VITE_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_RUN_ID: ${{ github.run_id }}
      - name: Redirect legacy deep links on GitHub Pages
        run: |
          cat > dist/404.html <<'EOF'
          <!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flexy Mini</title><script>location.replace('/flexy-mini/#/login');</script></head><body><a href="/flexy-mini/#/login">فتح صفحة الدخول</a></body></html>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
