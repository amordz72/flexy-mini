name: Verify isolated Flexy simulator
on:
  push:
    branches:
      - lab/flexy-simulator-20261013
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lab-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node --test tests/lab-simulator.test.mjs
      - run: npm run lab:prepare
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
