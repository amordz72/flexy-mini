<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#2563eb"/><meta name="application-name" content="Flexy Mini"/><meta name="mobile-web-app-capable" content="yes"/><link rel="manifest" href="/flexy-mini/manifest.webmanifest"/><link rel="icon" type="image/png" sizes="192x192" href="/flexy-mini/icons/icon-192.png"/><link rel="apple-touch-icon" href="/flexy-mini/icons/icon-192.png"/><title>Flexy Mini</title></head><body><div id="root"></div><script>
(function(){
 var key="flexy_mini_boot_diagnostics_v1", mounted=false, failed=false;
 function record(kind,detail){
  try{
   var rows=JSON.parse(localStorage.getItem(key)||"[]");
   if(!Array.isArray(rows))rows=[];
   rows.push({at:new Date().toISOString(),kind:kind,ms:Math.round(performance.now()),detail:detail||""});
   localStorage.setItem(key,JSON.stringify(rows.slice(-30)));
  }catch(e){}
 }
 record("boot-start");
 function mountCheck(){
  if(mounted||failed)return;
  var root=document.getElementById("root");
  if(!root||!root.childElementCount)return;
  mounted=true;record("app-mounted");
  if(observer)observer.disconnect();
 }
 var observer=new MutationObserver(mountCheck);
 var root=document.getElementById("root");
 if(root)observer.observe(root,{childList:true});
 window.addEventListener("error",function(e){
  if(e.target&&e.target.tagName==="SCRIPT"){
   failed=true;record("script-load-failed",String(e.target.src||"").split("/").pop());
   if(observer)observer.disconnect();
   var node=document.getElementById("root");
   if(!node||node.childElementCount)return;
   var box=document.createElement("section");box.dir="rtl";
   box.style.cssText="font:16px system-ui,sans-serif;padding:24px;max-width:520px;margin:12vh auto";
   var h=document.createElement("h2");h.textContent="تعذر تشغيل فليكسي ميني";
   var p=document.createElement("p");p.textContent="تعذر تحميل ملف التشغيل. بياناتك المحلية لم تُمسح.";
   var b=document.createElement("button");b.textContent="إعادة المحاولة";
   b.style.cssText="padding:12px 22px;background:#2563eb;color:white;border:0;border-radius:8px";
   b.onclick=function(){location.reload();};box.append(h,p,b);node.replaceChildren(box);
  }else if(e.target===window){record("runtime-error");}
 },true);
 window.addEventListener("unhandledrejection",function(){record("unhandled-rejection");});
 window.addEventListener("load",function(){record("window-load");mountCheck();});
})();
</script><script type="module" src="/src/main.tsx"></script></body></html>
